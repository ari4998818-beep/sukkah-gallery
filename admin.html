<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sukkah Gallery · Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@600;800&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#E6ECDB;--paper:#F8F9F2;--ink:#1D2A1A;--muted:#5A6A54;--line:#C9D2BC;--schach:#2E4A2B;--esrog:#E2B43A;--pom:#A5312B;--ok:#2F7A3D;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Rubik,system-ui,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--esrog);outline-offset:2px}
header{background:var(--schach);color:#EEF2E4;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font:800 1.15rem "Frank Ruhl Libre",serif;margin:0}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px}
.tab[aria-pressed="true"]{background:var(--schach);color:#fff;border-color:var(--schach)}
.tab b{margin-inline-start:4px}
.item{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.photos{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.photos a{flex:none}
.photos img{height:170px;border-radius:8px;display:block}
.item h2{font:600 1.3rem "Frank Ruhl Libre",serif;margin:0}
.muted{color:var(--muted);font-size:.92rem}
.story{margin:8px 0;white-space:pre-line}
.contact{background:#EEF2E5;border-radius:8px;padding:8px 10px;margin:8px 0;font-size:.93rem}
.links{margin:8px 0;padding:0;list-style:none}
.links li{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:.92rem;word-break:break-all}
.links button{border:0;background:none;color:var(--pom);flex:none}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600}
.approve{background:var(--ok);color:#fff}.reject{background:#E9D4D2;color:var(--pom)}.neutral{background:#E4EBD6;color:var(--schach)}
.login{max-width:380px;margin:12vh auto;background:var(--paper);padding:24px;border-radius:16px;border:1px solid var(--line)}
.login input{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:10px;margin:10px 0}
.err{color:var(--pom)}
table{width:100%;border-collapse:collapse;background:var(--paper);border-radius:12px;overflow:hidden;margin-bottom:18px}
th,td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--line);font-size:.93rem}
th{background:#E4EBD6}
h3{font:600 1.1rem "Frank Ruhl Libre",serif;margin:18px 0 6px}
.empty{color:var(--muted);text-align:center;padding:40px 0}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://rmacchunsqezcsaqdxsl.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtYWNjaHVuc3FlemNzYXFkeHNsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNjM1NzcsImV4cCI6MjEwNTgzOTU3N30.WDx6tF-ZURa36C2vsbqfqoY12NB8_TkmjgFdPTzbKeE";
const CAT = {creative:"Most creative",decor:"Best decor",lighting:"Best lighting",small:"Small space & balcony",kids:"Made by kids",budget:"Beautiful on a budget"};
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}} };
let KEY = ls.get("sg_admin") || "", rows = [], tab = "pending", err = "";
const app = document.getElementById("app");

async function load(){
  const { data, error } = await sb.rpc("admin_list", { k: KEY });
  if (error){ KEY=""; ls.del("sg_admin"); err = "That key didn't work. Check it and try again."; return render() }
  rows = data || []; err = ""; render();
}
function render(){
  if (!KEY){
    app.innerHTML = `<div class="login"><h1 style="font:800 1.5rem 'Frank Ruhl Libre',serif;margin:0">Admin</h1>
      <p class="muted">Enter your admin key. It stays saved on this device.</p>
      <input id="k" type="password" autocomplete="current-password" placeholder="Admin key">
      <button class="btn approve" id="go" style="width:100%">Open admin</button>
      ${err?`<p class="err">${esc(err)}</p>`:""}</div>`;
    return;
  }
  const count = s => rows.filter(r=>r.status===s).length;
  const tabs = [["pending","Pending"],["approved","Live"],["rejected","Rejected"],["leaders","Leaders"]];
  let body = "";
  if (tab==="leaders"){
    body = Object.entries(CAT).map(([c,label])=>{
      const l = rows.filter(r=>r.category===c && r.status==="approved").sort((a,b)=>b.votes-a.votes).slice(0,5);
      return `<h3>${esc(label)}</h3>${l.length?`<table><tr><th>#</th><th>Sukkah</th><th>Votes</th><th>Contact</th></tr>${l.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.title)}<br><span class="muted">${esc(r.city)}</span></td><td>${r.votes}</td><td>${esc(r.contact_name)}<br><span class="muted">${esc(r.contact)}</span></td></tr>`).join("")}</table>`:`<p class="muted">No live entries yet.</p>`}`;
    }).join("");
  } else {
    const list = rows.filter(r=>r.status===tab);
    body = list.length ? list.map(card).join("") : `<p class="empty">Nothing here.</p>`;
  }
  app.innerHTML = `<header><h1>Sukkah Gallery admin</h1><div><button class="btn neutral" id="refresh">Refresh</button> <button class="btn neutral" id="out">Log out</button></div></header>
    <div class="wrap"><div class="tabs">${tabs.map(([k,l])=>`<button class="tab" data-tab="${k}" aria-pressed="${tab===k}">${l}${k!=="leaders"?`<b>${count(k)}</b>`:""}</button>`).join("")}</div>${body}</div>`;
}
function card(r){
  const when = new Date(r.created_at).toLocaleString([], {weekday:"short",hour:"numeric",minute:"2-digit"});
  return `<div class="item">
    <div class="photos">${(r.photos||[]).map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="" loading="lazy"></a>`).join("")}</div>
    <h2>${esc(r.title)}</h2>
    <div class="muted">${esc(r.city)} · ${esc(CAT[r.category]||r.category)} · ${when}${r.status==="approved"?` · ♥ ${r.votes}`:""}</div>
    ${r.story?`<p class="story">${esc(r.story)}</p>`:""}
    <div class="contact">${esc(r.contact_name)} · ${esc(r.contact)}</div>
    ${(r.items||[]).length?`<ul class="links">${r.items.map((it,i)=>`<li><span><b>${esc(it.name)}</b><br><a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.url)}</a></span><button data-rmlink="${esc(r.id)}" data-i="${i}" aria-label="Remove link">Remove</button></li>`).join("")}</ul>`:""}
    <div class="actions">
      ${r.status!=="approved"?`<button class="btn approve" data-set="approved" data-id="${esc(r.id)}">Approve</button>`:""}
      ${r.status!=="rejected"?`<button class="btn reject" data-set="rejected" data-id="${esc(r.id)}">${r.status==="approved"?"Take down":"Reject"}</button>`:""}
      ${r.status==="rejected"?`<button class="btn neutral" data-set="pending" data-id="${esc(r.id)}">Back to pending</button>`:""}
    </div></div>`;
}
document.addEventListener("click", async e=>{
  const b = e.target.closest("button"); if(!b) return;
  if (b.id==="go"){ KEY = document.getElementById("k").value.trim(); if(KEY){ ls.set("sg_admin",KEY); load() } return }
  if (b.id==="out"){ KEY=""; ls.del("sg_admin"); rows=[]; render(); return }
  if (b.id==="refresh"){ b.textContent="…"; return load() }
  if (b.dataset.tab){ tab=b.dataset.tab; return render() }
  if (b.dataset.set){
    b.disabled = true;
    const { error } = await sb.rpc("admin_set_status", { k:KEY, sid:b.dataset.id, st:b.dataset.set });
    if (error){ alert("Didn't save. Try again."); b.disabled=false; return }
    const r = rows.find(x=>x.id===b.dataset.id); if(r) r.status = b.dataset.set; render(); return;
  }
  if (b.dataset.rmlink){
    const r = rows.find(x=>x.id===b.dataset.rmlink); if(!r) return;
    const items = r.items.filter((_,i)=>i!==+b.dataset.i);
    const { error } = await sb.rpc("admin_set_items", { k:KEY, sid:r.id, new_items:items });
    if (error){ alert("Didn't save. Try again."); return }
    r.items = items; render();
  }
});
document.addEventListener("keydown", e=>{ if(e.key==="Enter" && e.target.id==="k") document.getElementById("go").click() });
KEY ? load() : render();
</script>
</body>
</html>
