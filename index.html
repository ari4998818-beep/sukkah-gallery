<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Sukkah Gallery</title>
<meta name="description" content="Real sukkahs from real families. Vote for your favorites and shop the decorations.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;600;800&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6ECDB; --paper:#F8F9F2; --ink:#1D2A1A; --muted:#5A6A54; --line:#C9D2BC;
  --schach:#2E4A2B; --palm:#4F7340; --bamboo:#C6B07A; --esrog:#E2B43A; --pom:#A5312B;
  --display:"Frank Ruhl Libre", "Times New Roman", serif;
  --body:"Rubik", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--esrog);outline-offset:2px}
[hidden]{display:none!important}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;background:var(--schach);color:#EEF2E4;position:relative;z-index:3}
.brand{font-family:var(--display);font-weight:800;font-size:1.25rem;letter-spacing:.01em;text-decoration:none;color:inherit}
.top-actions{display:flex;gap:10px;align-items:center}
.lang{display:flex;border:1px solid rgba(255,255,255,.35);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;padding:6px 12px;font-size:.9rem;color:#EEF2E4}
.lang button[aria-pressed="true"]{background:#EEF2E4;color:var(--schach);font-weight:600}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:600;background:var(--esrog);color:#2A2308;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.top .btn{padding:8px 14px}

/* hero: looking up through the schach */
.hero{position:relative;overflow:hidden;padding:0 20px 36px}
.schach{display:block;width:100%;height:120px;margin:0 -20px;width:calc(100% + 40px)}
.hangers{position:absolute;inset:0 0 auto 0;height:260px;pointer-events:none}
.hang{position:absolute;top:70px;transform-origin:top center;animation:sway 5s ease-in-out infinite alternate}
.hang svg{display:block}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
@media (prefers-reduced-motion:reduce){.hang{animation:none}}
.hero-inner{position:relative;z-index:2;max-width:760px;margin:28px auto 0;text-align:center}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,7vw,4.4rem);line-height:1.02;margin:0 0 14px;letter-spacing:-.01em}
.hero p{font-size:1.1rem;color:var(--muted);max-width:52ch;margin:0 auto 22px}
.status{display:inline-block;margin-top:14px;font-size:.92rem;color:var(--muted)}
.status.paused{color:var(--pom);font-weight:500}

/* filters */
.bar{max-width:1200px;margin:0 auto;padding:0 20px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{white-space:nowrap;border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;font-size:.93rem}
.chip[aria-pressed="true"]{background:var(--schach);border-color:var(--schach);color:#fff}
.sort{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:7px 10px}

/* grid */
.grid{max-width:1200px;margin:0 auto;padding:0 20px 60px;columns:280px;column-gap:18px}
.card{break-inside:avoid;margin:0 0 18px;background:var(--paper);border-radius:14px;overflow:hidden;border:1px solid var(--line);cursor:pointer;display:block;width:100%;text-align:start;padding:0}
.card img{width:100%;height:auto;background:#d5dccb}
.card-body{padding:12px 14px 14px}
.card h3{font-family:var(--display);font-weight:600;font-size:1.25rem;line-height:1.15;margin:0 0 4px}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.9rem;gap:8px}
.heart{display:inline-flex;gap:5px;align-items:center;color:var(--pom);font-weight:600}
.tagcount{font-size:.82rem;color:var(--palm)}
.empty{max-width:520px;margin:30px auto 80px;text-align:center;color:var(--muted)}

/* modal shell */
.modal{position:fixed;inset:0;z-index:20;background:rgba(18,26,16,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--paper);border-radius:18px;width:min(1100px,100%);max-height:calc(100vh - 32px);overflow:auto;position:relative}
.close{position:absolute;top:10px;inset-inline-end:10px;z-index:4;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:1.3rem;line-height:1}

/* viewer */
.viewer{display:grid;grid-template-columns:1.6fr 1fr}
.stage{background:#141C12;position:relative;display:flex;align-items:center;justify-content:center;min-height:320px;padding:10px;touch-action:pan-y}
.frame{position:relative;display:inline-block;max-width:100%}
.frame img{max-height:72vh;max-width:100%;width:auto;user-select:none;-webkit-user-drag:none}
.pin{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:2px solid #fff;background:var(--esrog);color:#2A2308;font-weight:700;font-size:1rem;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 0 rgba(226,180,58,.7);animation:pulse 2.2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 12px rgba(226,180,58,0)}100%{box-shadow:0 0 0 0 rgba(226,180,58,0)}}
@media (prefers-reduced-motion:reduce){.pin{animation:none}}
.pop{position:absolute;z-index:3;background:var(--paper);color:var(--ink);border-radius:10px;padding:10px 12px;min-width:170px;max-width:240px;transform:translate(-50%,14px);font-size:.92rem}
.pop a{display:inline-block;margin-top:6px;font-weight:600;color:var(--schach)}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.85);font-size:1.3rem}
.nav.prev{inset-inline-start:10px}.nav.next{inset-inline-end:10px}
[dir="rtl"] .nav{transform:translateY(-50%) scaleX(-1)}
.dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.dots span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4)}
.dots span.on{background:#fff}
.info{padding:26px 24px}
.info h2{font-family:var(--display);font-size:2rem;line-height:1.08;margin:0 0 6px}
.info .where{color:var(--muted);margin:0 0 14px}
.catpill{display:inline-block;background:#E4EBD6;color:var(--schach);border-radius:999px;padding:3px 11px;font-size:.85rem;font-weight:500}
.story{margin:16px 0;white-space:pre-line}
.vote-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0 6px}
.vote{background:var(--pom);color:#fff}
.vote.done{background:#E9D4D2;color:var(--pom)}
.wa{background:#1E8E4E;color:#fff}
.rule{font-size:.85rem;color:var(--muted);margin:0 0 20px}
.shop h4{font-family:var(--display);font-size:1.2rem;margin:22px 0 8px;padding-top:16px;border-top:1px solid var(--line)}
.shop ol{margin:0;padding-inline-start:22px}
.shop li{margin:0 0 8px}
.shop a{color:var(--schach);font-weight:500}

/* submit wizard */
.wizard{max-width:680px;padding:26px 24px 24px}
.wizard h2{font-family:var(--display);font-size:1.9rem;margin:0 0 4px}
.steps{display:flex;gap:6px;margin:10px 0 22px}
.steps span{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps span.on{background:var(--palm)}
.steplabel{font-weight:600;margin:0 0 4px}
.hint{color:var(--muted);font-size:.93rem;margin:0 0 14px}
.drop{border:2px dashed var(--line);border-radius:14px;padding:28px 16px;text-align:center;background:#EFF3E7;display:block;cursor:pointer}
.drop strong{display:block;font-size:1.05rem;margin-bottom:4px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:14px}
.thumb{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:1;border:3px solid transparent;padding:0;background:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.cover{border-color:var(--esrog)}
.thumb .x{position:absolute;top:4px;inset-inline-end:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:.9rem;line-height:1}
.thumb .star{position:absolute;bottom:4px;inset-inline-start:4px;background:var(--esrog);color:#2A2308;border-radius:6px;font-size:.72rem;padding:1px 6px;font-weight:600}
label.f{display:block;margin:0 0 14px}
label.f span{display:block;font-weight:500;margin-bottom:5px}
label.f small{display:block;color:var(--muted);margin-top:4px}
.in{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff}
textarea.in{min-height:84px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tagstage{background:#141C12;border-radius:12px;display:flex;justify-content:center;padding:8px;cursor:crosshair}
.tagstage .frame img{max-height:48vh}
.pin.pending{background:#fff;animation:none}
.tagform{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px;margin-top:10px}
.taglist{list-style:none;padding:0;margin:12px 0 0}
.taglist li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.93rem}
.taglist button{border:0;background:none;color:var(--pom)}
.minithumbs{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.minithumbs button{padding:0;border:3px solid transparent;border-radius:8px;overflow:hidden;width:58px;height:58px;flex:none;background:none}
.minithumbs button.on{border-color:var(--esrog)}
.minithumbs img{width:100%;height:100%;object-fit:cover}
.wfoot{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.progress{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:18px 0 8px}
.progress i{display:block;height:100%;width:0;background:var(--palm);transition:width .2s}
.done-state{text-align:center;padding:30px 10px}
.done-state .big{font-size:3rem}
.err{color:var(--pom);font-size:.92rem;margin:8px 0 0}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;z-index:40;font-size:.95rem;max-width:90vw;text-align:center}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:0 20px 40px}

@media (max-width:820px){
  .viewer{grid-template-columns:1fr}
  .frame img{max-height:58vh}
  .modal{padding:0;align-items:stretch}
  .sheet{border-radius:0;max-height:100vh;height:100%}
  .row2{grid-template-columns:1fr}
  .tagform{grid-template-columns:1fr}
  .top{padding:10px 14px}
  #openSubmit{display:none}
  .hero-inner{margin-top:96px}
  .hang:nth-child(3),.hang:nth-child(4){display:none}
  .brand{font-size:1.05rem}
}
[dir="rtl"] body,[dir="rtl"]{font-family:var(--body)}
</style>
</head>

function toast(msg){
  const el = document.createElement("div"); el.className="toast"; el.textContent=msg;
  document.body.appendChild(el); setTimeout(()=>el.remove(), 3200);
}
function phase(kind){ // 'open' | 'paused' | 'closed'
  const now = Date.now();
  if (CONFIG.PAUSES.some(([a,b]) => now >= Date.parse(a) && now <= Date.parse(b))) return "paused";
  const close = Date.parse(kind==="submit" ? CONFIG.SUBMIT_CLOSES : CONFIG.VOTE_CLOSES);
  return now > close ? "closed" : "open";
}
function safeUrl(u){
  try{
    const url = new URL(u.trim());
    if (!/^https?:$/.test(url.protocol)) return null;
    if (CONFIG.AMAZON_TAG && /(^|\.)amazon\./.test(url.hostname)) url.searchParams.set("tag", CONFIG.AMAZON_TAG);
    return url.toString();
  }catch(e){ return null }
}

/* ---------- schach + hanging decorations ---------- */
function drawSchach(){
  const svg = $("#schach"); let out = "";
  const greens = ["#2E4A2B","#3D5F33","#4F7340","#5E7F46","#6B8A4E"];
  let seed = 7; const rnd = () => (seed = (seed*9301+49297)%233280)/233280;
  out += `<rect width="1200" height="120" fill="#243B21"/>`;
  for (let i=0;i<70;i++){ // palm/bamboo slats
    const x = rnd()*1250-25, w = 6+rnd()*14, rot = -14+rnd()*28, c = rnd()<.18 ? "#B39C62" : greens[Math.floor(rnd()*greens.length)];
    out += `<rect x="${x}" y="-20" width="${w}" height="${150+rnd()*20}" rx="3" fill="${c}" opacity="${.75+rnd()*.25}" transform="rotate(${rot} ${x} 60)"/>`;
  }
  for (let i=0;i<14;i++){ // cross beams
    const y = 10+rnd()*95;
    out += `<rect x="0" y="${y}" width="1200" height="${3+rnd()*4}" fill="${rnd()<.5?'#C6B07A':'#A58E57'}" opacity=".85" transform="rotate(${-1+rnd()*2} 600 ${y})"/>`;
  }
  svg.innerHTML = out;

  const deco = [
    // paper chain
    (len)=>`<svg width="30" height="${len+90}"><line x1="15" y1="0" x2="15" y2="${len}" stroke="#6B5B34" stroke-width="1.2"/>${[0,1,2,3,4].map(i=>`<ellipse cx="15" cy="${len+8+i*16}" rx="${i%2?6:9}" ry="9" fill="none" stroke="${['#A5312B','#E2B43A','#3D6FA8','#4F7340','#A5312B'][i]}" stroke-width="4"/>`).join("")}</svg>`,
    // esrog-yellow lantern
    (len)=>`<svg width="44" height="${len+64}"><line x1="22" y1="0" x2="22" y2="${len}" stroke="#6B5B34" stroke-width="1.2"/><rect x="14" y="${len}" width="16" height="6" rx="2" fill="#6B5B34"/><path d="M8 ${len+8} Q22 ${len+2} 36 ${len+8} L33 ${len+50} Q22 ${len+56} 11 ${len+50}Z" fill="#E2B43A"/><path d="M22 ${len+8} V${len+52}" stroke="#C8962A" stroke-width="1.5"/></svg>`,
    // pomegranate
    (len)=>`<svg width="40" height="${len+50}"><line x1="20" y1="0" x2="20" y2="${len}" stroke="#6B5B34" stroke-width="1.2"/><circle cx="20" cy="${len+24}" r="17" fill="#A5312B"/><path d="M14 ${len+6} L17 ${len+11} L20 ${len+5} L23 ${len+11} L26 ${len+6}" fill="#7E221E"/></svg>`,
    // star
    (len)=>`<svg width="44" height="${len+48}"><line x1="22" y1="0" x2="22" y2="${len}" stroke="#6B5B34" stroke-width="1.2"/><path d="M22 ${len} l18 31 h-36z M22 ${len+42} l18 -31 h-36z" fill="none" stroke="#3D6FA8" stroke-width="3.5" stroke-linejoin="round"/></svg>`
  ];
  const spots = [[6,40,0],[17,90,1],[29,30,2],[71,60,3],[83,20,1],[93,70,0]];
  $("#hangers").innerHTML = spots.map(([left,len,k],i)=>
    `<div class="hang" style="left:${left}%;animation-delay:-${i*.8}s;animation-duration:${4+i%3}s">${deco[k](len)}</div>`).join("");
}

/* ---------- demo art (only used in demo mode) ---------- */
function demoArt(v){
  const P = [
    {sky1:"#1B2340",sky2:"#3B3F6E",wall:"#D9C9A0",night:1,w:800,h:1000},
    {sky1:"#9CC7E0",sky2:"#E8F1F4",wall:"#FFFFFF",night:0,w:800,h:600},
    {sky1:"#231A33",sky2:"#5B3B5E",wall:"#8A6A43",night:1,w:800,h:900},
    {sky1:"#B8D6C0",sky2:"#F2F0E0",wall:"#E7D8B5",night:0,w:800,h:800},
    {sky1:"#0F1D2A",sky2:"#2D4A5E",wall:"#C9B791",night:1,w:800,h:1050},
    {sky1:"#F3D9A8",sky2:"#FBEFD9",wall:"#F4F4F0",night:0,w:800,h:640}
  ][v%6];
  const {w,h} = P, top = h*.3, base = h*.85;
  let lights = "";
  for (let i=0;i<14;i++){ const x = 110+i*42, y = top+18+Math.sin(i/1.3)*10;
    lights += `<circle cx="${x}" cy="${y}" r="${P.night?7:5}" fill="${['#FFD66B','#FF8A5B','#9BE08B','#7FC3FF'][i%4]}" ${P.night?'opacity=".95"':''}/>`;
    if (P.night) lights += `<circle cx="${x}" cy="${y}" r="16" fill="#FFD66B" opacity=".18"/>`; }
  let schach = ""; for (let i=0;i<40;i++){ const x = 80+i*16; schach += `<rect x="${x}" y="${top-40}" width="12" height="46" rx="3" fill="${i%3?'#3D5F33':'#5E7F46'}" transform="rotate(${(i%5)-2} ${x} ${top})"/>`; }
  let chains = ""; for (let i=0;i<5;i++){ const x = 170+i*115; chains += `<line x1="${x}" y1="${top+10}" x2="${x}" y2="${top+80+(i%2)*40}" stroke="#6B5B34"/><circle cx="${x}" cy="${top+95+(i%2)*40}" r="16" fill="${['#A5312B','#E2B43A','#3D6FA8','#4F7340','#E2B43A'][i]}"/>`; }
  let planks = ""; for (let i=0;i<9;i++){ planks += `<line x1="${100+i*75}" y1="${top}" x2="${100+i*75}" y2="${base}" stroke="#00000018" stroke-width="2"/>`; }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${P.sky1}"/><stop offset="1" stop-color="${P.sky2}"/></linearGradient></defs><rect width="${w}" height="${h}" fill="url(#g)"/><rect y="${base}" width="${w}" height="${h-base}" fill="${P.night?'#1E2A1B':'#8FA878'}"/><rect x="90" y="${top}" width="620" height="${base-top}" fill="${P.wall}"/>${planks}<rect x="260" y="${top+90}" width="280" height="${base-top-90}" fill="${P.night?'#FFE3A0':'#6B4E2E'}" opacity="${P.night?.55:.35}"/>${schach}${chains}${lights}</svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}

/* ---------- data ---------- */
async function loadData(){
  if (DEMO){ S.list = demoData(); return }
  const [{data:rows,error}, {data:counts}] = await Promise.all([
    sb.from("sukkahs").select("id,title,city,category,story,photos,items,created_at").eq("status","approved"),
    sb.from("vote_counts").select("sukkah_id,votes")
  ]);
  if (error){ console.error(error); S.list = []; return }
  const c = Object.fromEntries((counts||[]).map(r=>[r.sukkah_id, r.votes]));
  S.list = rows.map(r=>({...r, photos:r.photos||[], items:r.items||[], votes:c[r.id]||0}));
}

/* ---------- render: static text ---------- */
function applyLang(){
  document.documentElement.lang = lang==="yi" ? "yi" : "en";
  document.documentElement.dir = lang==="yi" ? "rtl" : "ltr";
  document.title = t("brand");
  document.querySelectorAll("[data-i]").forEach(el => el.textContent = t(el.dataset.i));
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang===lang));
  const sp = phase("submit"), vp = phase("vote"), st = $("#status");
  st.className = "status" + (sp==="paused" ? " paused" : "");
  st.textContent = (DEMO ? t("demo")+" " : "") + (sp==="paused" ? t("paused") : vp==="closed" ? t("closed") : sp==="closed" ? t("subClosed") : t("open"));
  const canSubmit = sp==="open";
  $("#openSubmit").disabled = $("#openSubmit2").disabled = !canSubmit;
  renderChips(); renderGrid();
}
function renderChips(){
  $("#chips").innerHTML = ["all",...CATS].map(c =>
    `<button class="chip" data-cat="${c}" aria-pressed="${S.filter===c}">${esc(t(c))}</button>`).join("");
}
function sorted(){
  let l = S.list.filter(s => S.filter==="all" || s.category===S.filter);
  const age = s => (Date.now()-Date.parse(s.created_at))/36e5;
  if (S.sort==="new") l.sort((a,b)=>Date.parse(b.created_at)-Date.parse(a.created_at));
  else if (S.sort==="votes") l.sort((a,b)=>b.votes-a.votes);
  else l.sort((a,b)=> (b.votes+1)/Math.pow(age(b)+2,.8) - (a.votes+1)/Math.pow(age(a)+2,.8));
  return l;
}
function renderGrid(){
  const l = sorted();
  $("#empty").hidden = l.length>0; $("#empty").textContent = t("empty");
  $("#grid").innerHTML = l.map(s => `
    <button class="card" data-id="${esc(s.id)}">
      <img src="${esc(s.photos[0])}" alt="${esc(s.title)}" loading="lazy">
      <div class="card-body">
        <h3>${esc(s.title)}</h3>
        <div class="meta"><span>${esc(s.city)}</span><span class="heart">♥ ${s.votes}</span></div>
        ${s.items?.length ? `<div class="tagcount">🛍 ${s.items.length} ${esc(t("items"))}</div>` : ""}
      </div>
    </button>`).join("");
}

/* ---------- viewer ---------- */
let V = { s:null, i:0 };
function openViewer(id){

function closeModal(m){ $(m).hidden = true; document.body.style.overflow=""; if(m==="#viewerModal") history.replaceState(null,"",location.pathname+location.search) }
function renderViewer(){
  const {s,i} = V, n = s.photos.length;
  const pins = (s.items||[]).map((it,k)=>({...it,k})).filter(it=>it.p===i);
  const voted = myVotes[s.category];
  const shareUrl = location.origin + location.pathname + "#s=" + encodeURIComponent(s.id);
  const wa = "https://wa.me/?text=" + encodeURIComponent(t("shareText")+" "+s.title+"\n"+shareUrl);
  $("#viewerSheet").innerHTML = `
    <button class="close" data-close="#viewerModal" aria-label="Close">×</button>
    <div class="viewer">
      <div class="stage" id="stage">
        <div class="frame" id="frame">
          <img src="${esc(s.photos[i])}" alt="${esc(s.title)}">
          ${pins.map(p=>`<button class="pin" style="left:${p.x}%;top:${p.y}%" data-pin="${p.k}" aria-label="${esc(p.name)}">+</button>`).join("")}
        </div>
        ${n>1?`<button class="nav prev" data-nav="-1" aria-label="Previous">‹</button><button class="nav next" data-nav="1" aria-label="Next">›</button>
        <div class="dots">${s.photos.map((_,k)=>`<span class="${k===i?'on':''}"></span>`).join("")}</div>`:""}
      </div>
      <div class="info">
        <span class="catpill">${esc(t(s.category))}</span>
        <h2>${esc(s.title)}</h2>
        <p class="where">${esc(s.city)} · ♥ ${s.votes} ${esc(t("votes"))}</p>
        ${s.story?`<p class="story">${esc(s.story)}</p>`:""}
        <div class="vote-row">
          <button class="btn vote ${voted===String(s.id)?'done':''}" id="voteBtn" ${phase("vote")!=="open"?"disabled":""}>${voted===String(s.id)?esc(t("voted")):"♥ "+esc(t("vote"))}</button>
          <a class="btn wa" href="${wa}" target="_blank" rel="noopener">${esc(t("share"))}</a>
        </div>
        <p class="rule">${esc(t("oneVote"))}</p>
        ${s.items?.length?`<div class="shop"><h4>${esc(t("shop"))}</h4><ol>${s.items.map(it=>{const u=safeUrl(it.url);return `<li>${u?`<a href="${esc(u)}" target="_blank" rel="noopener sponsored">${esc(it.name)}</a>`:esc(it.name)}</li>`}).join("")}</ol></div>`:""}
      </div>
    </div>`;
  // swipe
  const st = $("#stage"); let x0=null;
  st.addEventListener("touchstart",e=>x0=e.touches[0].clientX,{passive:true});
  st.addEventListener("touchend",e=>{ if(x0===null)return; const dx=e.changedTouches[0].clientX-x0; x0=null;
    if(Math.abs(dx)>45){ const dir = (dx<0?1:-1)*(lang==="yi"?-1:1); step(dir) } });
}
function step(d){ const n=V.s.photos.length; V.i=(V.i+d+n)%n; renderViewer() }
function showPop(k){
  document.querySelectorAll(".pop").forEach(p=>p.remove());
  const it = V.s.items[k]; const u = safeUrl(it.url);
  const pop = document.createElement("div"); pop.className="pop";
  pop.style.left = it.x+"%"; pop.style.top = it.y+"%";
  pop.innerHTML = `<div>${esc(it.name)}</div>${u?`<a href="${esc(u)}" target="_blank" rel="noopener sponsored">${esc(t("shopBtn"))}</a>`:""}`;
  $("#frame").appendChild(pop);
}
async function vote(){
  const s = V.s;
  if (phase("vote")!=="open") return;
  if (myVotes[s.category]){ toast(myVotes[s.category]===String(s.id)?t("voted"):t("alreadyVoted")); return }
  if (!DEMO){
    const { error } = await sb.from("votes").insert({ voter_id:voterId, category:s.category, sukkah_id:s.id });
    if (error){ if (error.code==="23505"){ myVotes[s.category]="?"; store.set("sg_votes",JSON.stringify(myVotes)); toast(t("alreadyVoted")) } else toast(t("failed")); return }
  }
  s.votes++; myVotes[s.category]=String(s.id); store.set("sg_votes",JSON.stringify(myVotes));
  renderViewer(); renderGrid(); toast(t("votedToast"));
}

      </div></div>
      ${ph.length>1?`<div class="minithumbs">${ph.map((p,k)=>`<button data-tp="${k}" class="${k===W.tagP?'on':''}"><img src="${p.url}" alt=""></button>`).join("")}</div>`:""}
      ${W.pending?`<div class="tagform"><input class="in" id="itName" placeholder="${esc(t("itemNamePh"))}" aria-label="${esc(t("itemName"))}" maxlength="60"><input class="in" id="itUrl" placeholder="https://" aria-label="${esc(t("itemUrl"))}" inputmode="url"><button class="btn" id="itAdd">${esc(t("add"))}</button></div>`:""}
      <ul class="taglist">${W.items.map((it,k)=>`<li><span>${k+1}. ${esc(it.name)}</span><button data-rmi="${k}" aria-label="Remove">×</button></li>`).join("")}</ul>
      ${W.busy?`<div class="progress"><i id="prog"></i></div><p class="hint">${esc(t("uploading"))}</p>`:""}`;
  }
  const foot = `<div class="wfoot">
    ${W.step>1?`<button class="btn ghost" id="wBack" ${W.busy?'disabled':''}>${esc(t("back"))}</button>`:"<span></span>"}
    <button class="btn" id="wNext" ${W.busy?'disabled':''}>${esc(W.step<3?t("next"):(W.items.length?t("send"):t("skip")))}</button></div>`;
  el.innerHTML = `<button class="close" data-close="#submitModal" aria-label="Close">×</button><h2>${esc(t("submit"))}</h2>${bar}${body}${W.err?`<p class="err">${esc(W.err)}</p>`:""}${foot}`;
  if (W.step===3 && W.pending) setTimeout(()=>$("#itName")?.focus(),30);
}
async function compress(file){
  const bmp = await createImageBitmap(file);
  const max = 1600, r = Math.min(1, max/Math.max(bmp.width,bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width*r); c.height = Math.round(bmp.height*r);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  const blob = await new Promise(res=>c.toBlob(res,"image/jpeg",.82));
  return { blob, url:URL.createObjectURL(blob) };
}
async function addFiles(files){
  W.err="";
  for (const f of files){
    if (!f.type.startsWith("image/")) continue;
    if (W.photos.length>=CONFIG.MAX_PHOTOS){ W.err=t("tooMany"); break }
    try{ W.photos.push(await compress(f)) }catch(e){ console.error(e) }
  }
  renderWizard();
}
async function wizardNext(){
  W.err="";
  if (W.step===1){ if(!W.photos.length){W.err=t("needPhoto");return renderWizard()} W.step=2; return renderWizard() }
  if (W.step===2){ const f=W.f; if(!f.title.trim()||!f.city.trim()||!f.category||!f.name.trim()||!f.contact.trim()){W.err=t("needFields");return renderWizard()} W.step=3; W.tagP=0; return renderWizard() }
  // submit
  W.busy=true; W.pending=null; renderWizard();
  const ph = orderedPhotos();
  try{
    let urls;
    const id = crypto.randomUUID();
    if (DEMO){ urls = ph.map(p=>p.url); await new Promise(r=>setTimeout(r,700)) }
    else {
      urls = [];
      for (let k=0;k<ph.length;k++){
        const path = `${id}/${k}.jpg`;
        const { error } = await sb.storage.from("sukkah-photos").upload(path, ph[k].blob, { contentType:"image/jpeg" });
        if (error) throw error;
        urls.push(sb.storage.from("sukkah-photos").getPublicUrl(path).data.publicUrl);
        const bar = $("#prog"); if (bar) bar.style.width = ((k+1)/ph.length*100)+"%";
      }
      const f = W.f;
      const r1 = await sb.from("sukkahs").insert({ id, title:f.title.trim(), city:f.city.trim(), category:f.category, story:f.story.trim(), photos:urls, items:W.items, lang });
      if (r1.error) throw r1.error;
      const r2 = await sb.from("contacts").insert({ sukkah_id:id, name:f.name.trim(), contact:f.contact.trim() });
      if (r2.error) console.error(r2.error);
    }
    if (DEMO) S.list.unshift({ id, ...W.f, photos:urls, items:W.items, votes:0, created_at:new Date().toISOString() }), renderGrid();
    W.busy=false; W.done=true; renderWizard();
  }catch(e){ console.error(e); W.busy=false; W.err=t("failed"); renderWizard() }
}

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  const el = e.target.closest("button,[data-cover],a"); if(!el) {
    if (e.target.id==="viewerModal") closeModal("#viewerModal");
    if (e.target.id==="submitModal" && !W?.busy) closeModal("#submitModal");
    return }
  const d = el.dataset;
  if (d.lang){ lang=d.lang; store.set("sg_lang",lang); applyLang(); if(!$("#viewerModal").hidden) renderViewer(); if(!$("#submitModal").hidden) renderWizard(); return }
  if (d.cat){ S.filter=d.cat; renderChips(); renderGrid(); return }
  if (el.classList.contains("card")) return openViewer(d.id);
  if (d.close){ if(!(d.close==="#submitModal" && W?.busy)) closeModal(d.close); return }
  if (d.nav) return step(+d.nav);
  if (d.pin!==undefined){ e.stopPropagation(); return showPop(+d.pin) }
  if (el.id==="voteBtn") return vote();
  if (el.id==="openSubmit"||el.id==="openSubmit2") return openSubmit();
  if (d.rm!==undefined){ e.stopPropagation(); const k=+d.rm; W.photos.splice(k,1); if(W.cover>=W.photos.length||W.cover===k) W.cover=0; W.items=[]; return renderWizard() }
  if (d.cover!==undefined){ W.cover=+d.cover; W.items=[]; return renderWizard() }
  if (d.tp!==undefined){ W.tagP=+d.tp; W.pending=null; return renderWizard() }
  if (d.rmi!==undefined){ W.items.splice(+d.rmi,1); return renderWizard() }
  if (el.id==="itAdd"){
    const name=$("#itName").value.trim(), url=safeUrl($("#itUrl").value||"");
    if(!name||!url){ W.err=t("badLink"); return renderWizard() }
    W.items.push({ p:W.tagP, x:W.pending.x, y:W.pending.y, name, url }); W.pending=null; W.err=""; return renderWizard();
  }
  if (el.id==="wBack"){ W.step--; W.err=""; W.pending=null; return renderWizard() }
  if (el.id==="wNext") return wizardNext();
});
document.addEventListener("click", e=>{ // tap-to-tag on photo
  if (e.target.id!=="tagImg" || W?.busy) return;
  const r = e.target.getBoundingClientRect();
  W.pending = { x:+((e.clientX-r.left)/r.width*100).toFixed(1), y:+((e.clientY-r.top)/r.height*100).toFixed(1) };
  W.err=""; renderWizard();
});
document.addEventListener("click", e=>{ if(!e.target.closest(".pin,.pop")) document.querySelectorAll(".pop").forEach(p=>p.remove()) });
document.addEventListener("change", e=>{ if(e.target.id==="fileIn") addFiles([...e.target.files]); if(e.target.dataset.f) W.f[e.target.dataset.f]=e.target.value });
document.addEventListener("input", e=>{ if(e.target.dataset.f) W.f[e.target.dataset.f]=e.target.value });
document.addEventListener("keydown", e=>{
  if (e.key==="Escape"){ if(!$("#viewerModal").hidden) closeModal("#viewerModal"); else if(!$("#submitModal").hidden && !W.busy) closeModal("#submitModal") }
  if (!$("#viewerModal").hidden && (e.key==="ArrowRight"||e.key==="ArrowLeft")) step((e.key==="ArrowRight"?1:-1)*(lang==="yi"?-1:1));
  if (e.key==="Enter" && e.target.dataset.cover!==undefined){ W.cover=+e.target.dataset.cover; renderWizard() }
});
document.addEventListener("dragover", e=>{ if(e.target.closest("#drop")) e.preventDefault() });
document.addEventListener("drop", e=>{ if(e.target.closest("#drop")){ e.preventDefault(); addFiles([...e.dataTransfer.files]) } });
$("#sort").addEventListener("change", e=>{ S.sort=e.target.value; renderGrid() });

/* ---------- boot ---------- */
(async function boot(){
  drawSchach();
  if (!DEMO && window.supabase) sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  applyLang();
  await loadData(); renderGrid();
  const m = location.hash.match(/^#s=(.+)$/); if (m) openViewer(decodeURIComponent(m[1]));
  setInterval(applyLang, 60000); // flips to paused/closed on time
})();
</script>
